name: Product site and docs

on:
  push:
    branches: [main]
    paths:
      - website/**
      - scripts/build-site.mjs
      - scripts/site.test.mjs
      - package.json
      - package-lock.json
      - ARCHITECTURE.md
      - RELEASING.md
      - SECURITY.md
      - LICENSE
      - NOTICE
      - licenses/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - scripts/build-site.mjs
      - scripts/site.test.mjs
      - package.json
      - package-lock.json
      - ARCHITECTURE.md
      - RELEASING.md
      - SECURITY.md
      - LICENSE
      - NOTICE
      - licenses/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm run site:build
        env:
          SITE_BASE: ${{ github.event_name == 'pull_request' && '/trolley/' || steps.pages.outputs.base_path }}
      - run: npm run test:site
        env:
          SITE_BASE: ${{ github.event_name == 'pull_request' && '/trolley/' || steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy product site and docs
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
