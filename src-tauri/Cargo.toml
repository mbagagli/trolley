[package]
name = "trolley"
version = "0.3.2"
description = "A local-first project planning desktop application"
license = "GPL-3.0-or-later"
authors = ["Trolley contributors"]
edition = "2024"

[lib]
name = "trolley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
log = "0.4"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tempfile = "3"
zip = { version = "9.0.5", default-features = false }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["std", "NSRunningApplication", "libc"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSArray", "NSString", "NSObject"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
# Backport the upstream VariantStrIter fix without changing GTK APIs.
glib = { path = "vendor/glib" }

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

# Exercise the GLib advisory regression with optimized code in normal tests.
[profile.dev.package.glib]
opt-level = 2
